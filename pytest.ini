[pytest]
# ─── Markers ──────────────────────────────────────────────────────────────────
markers =
    android: Android/Appium tests (requires connected device or emulator)
    web: Web/Selenium tests (requires browser)
    api: API/HTTP tests (no device required)
    smoke: Critical path tests — run first
    regression: Full regression suite
    security: Security and auth-related tests
    slow: Tests that take > 30 seconds

# ─── Default Options ──────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    --junitxml=reports/junit/results.xml
    --html=reports/html/report.html
    --self-contained-html
    --alluredir=reports/allure-results

# ─── Console Logging ──────────────────────────────────────────────────────────
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# ─── Test Discovery ───────────────────────────────────────────────────────────
testpaths = projects
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
# Exclude page object and screen directories — they are NOT test files
norecursedirs = pages screens node_modules .venv .git __pycache__ reports logs
